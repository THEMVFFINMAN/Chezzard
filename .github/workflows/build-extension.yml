name: Build GDExtension

# Compiles the Fairy-Stockfish GDExtension for every platform in the cloud, so
# you never compile locally. Runs on push to main, or on demand from the
# Actions tab ("Run workflow"). Download the finished binaries from the run's
# "Artifacts" section and drop them into addons/fairy_engine/bin/.

on:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - 'addons/fairy_engine/**'
      - '.github/workflows/build-extension.yml'
  workflow_dispatch:

env:
  # godot-cpp's newest branch is 4.5; a 4.5 extension loads in Godot 4.6 too.
  GODOT_CPP_BRANCH: "4.5"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,       os: windows-latest, platform: windows, arch: x86_64 }
          - { name: linux,         os: ubuntu-latest,  platform: linux,   arch: x86_64 }
          - { name: macos,         os: macos-latest,   platform: macos,   arch: universal }
          - { name: android-arm64, os: ubuntu-latest,  platform: android, arch: arm64 }
          - { name: ios-arm64,     os: macos-latest,   platform: ios,     arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Clone dependencies
        shell: bash
        run: |
          cd native
          git clone --depth 1 --branch "$GODOT_CPP_BRANCH" https://github.com/godotengine/godot-cpp.git
          git clone --depth 1 https://github.com/fairy-stockfish/Fairy-Stockfish.git

      # MSVC uses an empty NNUE stub; clang/gcc embed the net via INCBIN and need
      # the file present, so fetch it everywhere except Windows.
      - name: Fetch NNUE net
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd native/Fairy-Stockfish/src
          make net

      - name: Build (debug + release)
        shell: bash
        run: |
          cd native
          scons platform=${{ matrix.platform }} target=template_debug   arch=${{ matrix.arch }}
          scons platform=${{ matrix.platform }} target=template_release arch=${{ matrix.arch }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: fairy_engine-${{ matrix.name }}
          path: addons/fairy_engine/bin/
          if-no-files-found: error
