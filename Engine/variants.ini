#chancellor = rook bishop
chancellor = e

#amazon = queen knight
amazon = x

#centaur = royal knight knight
centaur = c

extinctionValue = loss
extinctionPseudoRoyal = true
extinctionPieceTypes = l
extinctionPieceCount = 1

promotionPieceTypes = qnbrc
promotionRegionWhite = *8
promotionPawnTypes = p

