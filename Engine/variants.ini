#  make build ARCH=x86-64 largeboards=yes all=yes debug=yes

[custom:chess]
# now we add the archbishop and assign it "a" as an abbreviation

# since bishops are obsolete now, we remove them. This isn't strictly required, but recommended.
#pieceToCharTable = PNBRQST...............Kpnbrqst...............k
# we also need to update the promotion rules accordingly

# and now let's define the new starting position

#shortrook
customPiece1 = s:R4

#shortbishop
customPiece2 = t:B3

#shortknight
customPiece3 = m:F

#shortpawn
customPiece4 = z:fmWfceF

#giraffe = (1,4) leaper / "two-longer knight" (was g:C, which is actually a camel)
customPiece5 = g:G

#princess = short queen
customPiece6 = u:R4B3

#archbishop (bishop and knight)
archbishop = a

#chancellor = rook bishop
chancellor = e

#amazon = queen knight
amazon = x

#centaur = royal knight knight
centaur = c

#wall = immobile blocker (the "w" piece type)
immobile = w

extinctionValue = loss
extinctionPseudoRoyal = true
extinctionPieceTypes = l
extinctionPieceCount = 1

promotionPieceTypes = qnbrc
promotionRegionWhite = *8
promotionPawnTypes = pz
enPassantTypes = pz

#knightrider 
customPiece8 = d:NN

#man
customPiece9 = f:WF

# royal bishop
customPiece10 = h:WFB

# royal rook
customPiece11 = i:WFR

#Empress
customPiece12 = j:Q

#Prince
customPiece13 = l:W

# Three-check mode: identical to custom, but a side wins by giving 3 checks.
# The check count rides in the FEN (e.g. "3+3"). Select via UCI_Variant=custom3check.
[custom3check:custom]
checkCounting = true

# Atomic: a capture detonates, removing the capturer and adjacent non-pawns; a
# blown-up royal loses. UCI_Variant=customatomic.
[customatomic:custom]
blastOnCapture = true

# King of the Hill: the royal piece (prince "l") wins by reaching a centre
# square. UCI_Variant=customkoth. (Flag options may need tuning per engine build.)
[customkoth:custom]
flagPiece = l
whiteFlag = d4 e4 d5 e5
blackFlag = d4 e4 d5 e5

